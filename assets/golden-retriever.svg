<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="goldenTitle">
  <title id="goldenTitle">A simple drawing of a Golden Retriever's head</title>

  <!-- soft ground shadow -->
  <ellipse cx="150" cy="274" rx="72" ry="11" fill="#000000" opacity="0.06" />

  <!-- long feathered ears behind the head -->
  <ellipse cx="90" cy="172" rx="28" ry="60" fill="#c98f3f" transform="rotate(14 90 172)" />
  <ellipse cx="210" cy="172" rx="28" ry="60" fill="#c98f3f" transform="rotate(-14 210 172)" />

  <!-- head -->
  <ellipse cx="150" cy="140" rx="64" ry="58" fill="#e0a951" />

  <!-- lighter fur on the forehead -->
  <ellipse cx="150" cy="120" rx="30" ry="32" fill="#eebb6a" />

  <!-- fur tufts on top of the head -->
  <path d="M118 92 C124 74 136 74 140 88 C146 74 158 74 162 88 C168 76 178 80 180 94 Z" fill="#e0a951" />

  <!-- cream muzzle -->
  <ellipse cx="150" cy="178" rx="38" ry="27" fill="#f6e3c2" />

  <!-- eyes -->
  <circle cx="125" cy="139" r="9" fill="#3a3226" />
  <circle cx="175" cy="139" r="9" fill="#3a3226" />
  <circle cx="122" cy="136" r="2.8" fill="#ffffff" />
  <circle cx="172" cy="136" r="2.8" fill="#ffffff" />

  <!-- nose -->
  <ellipse cx="150" cy="165" rx="16" ry="12" fill="#3a3226" />
  <ellipse cx="145" cy="161" rx="4.5" ry="2.6" fill="#ffffff" opacity="0.45" />

  <!-- open smile with tongue -->
  <path d="M150 177 L150 183" fill="none" stroke="#3a3226" stroke-width="3" stroke-linecap="round" />
  <path d="M150 183 C143 193 132 190 129 182" fill="none" stroke="#3a3226" stroke-width="3" stroke-linecap="round" />
  <path d="M150 183 C157 193 168 190 171 182" fill="none" stroke="#3a3226" stroke-width="3" stroke-linecap="round" />
  <path d="M138 190 C138 200 148 202 150 194 C152 202 162 200 162 190 Z" fill="#e0857f" />

  <!-- brow patches -->
  <ellipse cx="125" cy="120" rx="10" ry="5" fill="#c98f3f" opacity="0.5" />
  <ellipse cx="175" cy="120" rx="10" ry="5" fill="#c98f3f" opacity="0.5" />
</svg>
