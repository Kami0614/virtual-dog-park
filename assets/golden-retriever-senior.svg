<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="goldenSeniorTitle">
  <title id="goldenSeniorTitle">A simple drawing of a senior Golden Retriever's head</title>

  <!-- soft ground shadow -->
  <ellipse cx="150" cy="274" rx="72" ry="11" fill="#000000" opacity="0.06" />

  <!-- long feathered ears behind the head -->
  <ellipse cx="90" cy="172" rx="28" ry="60" fill="#c98f3f" transform="rotate(14 90 172)" />
  <ellipse cx="210" cy="172" rx="28" ry="60" fill="#c98f3f" transform="rotate(-14 210 172)" />

  <!-- head -->
  <ellipse cx="150" cy="140" rx="64" ry="58" fill="#e0a951" />

  <!-- lighter fur on the forehead -->
  <ellipse cx="150" cy="120" rx="30" ry="32" fill="#eebb6a" />

  <!-- fur tufts on top of the head -->
  <path d="M118 92 C124 74 136 74 140 88 C146 74 158 74 162 88 C168 76 178 80 180 94 Z" fill="#e0a951" />

  <!-- whitening muzzle -->
  <ellipse cx="150" cy="178" rx="38" ry="27" fill="#e6dfcf" />

  <!-- eyes with droopy upper lids -->
  <circle cx="125" cy="139" r="9" fill="#3a3226" />
  <circle cx="175" cy="139" r="9" fill="#3a3226" />
  <circle cx="122" cy="136" r="2.8" fill="#ffffff" />
  <circle cx="172" cy="136" r="2.8" fill="#ffffff" />
  <path d="M116 131 Q125 127 134 131" fill="none" stroke="#6f675f" stroke-width="2.5" stroke-linecap="round" />
  <path d="M166 131 Q175 127 184 131" fill="none" stroke="#6f675f" stroke-width="2.5" stroke-linecap="round" />

  <!-- grey eyebrow tufts -->
  <ellipse cx="125" cy="118" rx="11" ry="5" fill="#a49c92" />
  <ellipse cx="175" cy="118" rx="11" ry="5" fill="#a49c92" />

  <!-- nose -->
  <ellipse cx="150" cy="165" rx="16" ry="12" fill="#3a3226" />
  <ellipse cx="145" cy="161" rx="4.5" ry="2.6" fill="#ffffff" opacity="0.45" />

  <!-- calm senior smile -->
  <path d="M150 177 L150 183" fill="none" stroke="#3a3226" stroke-width="3" stroke-linecap="round" />
  <path d="M150 183 C143 192 132 189 129 181" fill="none" stroke="#3a3226" stroke-width="3" stroke-linecap="round" />
  <path d="M150 183 C157 192 168 189 171 181" fill="none" stroke="#3a3226" stroke-width="3" stroke-linecap="round" />

  <!-- grey hairs on top of the head -->
  <path d="M126 90 L131 82 M139 86 L143 78 M152 85 L155 77 M165 87 L170 80"
        fill="none" stroke="#c9c1b4" stroke-width="3" stroke-linecap="round" />

  <!-- whitening chin fur -->
  <path d="M136 200 C140 208 146 210 150 208 C154 210 160 208 164 200"
        fill="none" stroke="#c9c1b4" stroke-width="3" stroke-linecap="round" />
</svg>
